<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEYE Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }
    h1 {
      font-size: 18px;
      color: #F5C842;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    label {
      display: block;
      font-size: 11px;
      color: rgba(232,232,232,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      margin-top: 20px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 14px;
      color: #e8e8e8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #F5C842; }
    input[type="password"] { letter-spacing: 2px; }
    button {
      margin-top: 28px;
      width: 100%;
      background: #F5C842;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    .msg.ok { color: #4ade80; }
    .msg.err { color: #f87171; }

    /* Login state */
    .login-view, .config-view { display: none; }
    .login-view.active, .config-view.active { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>SEYE ADMIN</h1>

    <!-- Login -->
    <div class="login-view active" id="loginView">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" placeholder="Enter admin password">
      <button id="loginBtn">LOGIN</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- Config -->
    <div class="config-view" id="configView">
      <label for="caInput">Contract Address (CA)</label>
      <input type="text" id="caInput" placeholder="0x... or pump address">

      <label for="twitterInput">Twitter URL</label>
      <input type="text" id="twitterInput" placeholder="https://x.com/...">

      <label for="communityInput">Community URL</label>
      <input type="text" id="communityInput" placeholder="https://t.me/... or discord link">

      <button id="saveBtn">SAVE</button>
      <div class="msg" id="configMsg"></div>
    </div>
  </div>

  <script>
    let authHash = '';

    // SHA-256 hash
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Login
    document.getElementById('loginBtn').addEventListener('click', async function () {
      const pw = document.getElementById('password').value;
      if (!pw) return;

      authHash = await sha256(pw);

      try {
        const res = await fetch('/api/config', {
          headers: { 'X-Admin-Hash': authHash }
        });

        if (res.status === 401) {
          document.getElementById('loginMsg').textContent = 'wrong password.';
          document.getElementById('loginMsg').className = 'msg err';
          authHash = '';
          return;
        }

        const data = await res.json();
        document.getElementById('caInput').value = data.ca || '';
        document.getElementById('twitterInput').value = data.twitter || '';
        document.getElementById('communityInput').value = data.community || '';

        document.getElementById('loginView').classList.remove('active');
        document.getElementById('configView').classList.add('active');
      } catch (e) {
        document.getElementById('loginMsg').textContent = 'connection error.';
        document.getElementById('loginMsg').className = 'msg err';
      }
    });

    // Enter key on password
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // Save
    document.getElementById('saveBtn').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      const msg = document.getElementById('configMsg');

      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Hash': authHash
          },
          body: JSON.stringify({
            ca: document.getElementById('caInput').value.trim(),
            twitter: document.getElementById('twitterInput').value.trim(),
            community: document.getElementById('communityInput').value.trim()
          })
        });

        if (res.ok) {
          msg.textContent = 'saved.';
          msg.className = 'msg ok';
        } else {
          msg.textContent = 'error saving.';
          msg.className = 'msg err';
        }
      } catch (e) {
        msg.textContent = 'connection error.';
        msg.className = 'msg err';
      }

      btn.disabled = false;
      setTimeout(function () { msg.textContent = ''; }, 3000);
    });
  </script>
</body>
</html>
